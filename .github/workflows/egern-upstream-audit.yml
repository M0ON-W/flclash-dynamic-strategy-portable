name: Egern upstream audit

on:
  schedule:
    - cron: "37 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate public Egern artifacts
        run: python egern/scripts/validate_egern.py
      - name: Generate review-only upstream report
        run: python egern/scripts/audit_upstreams.py --output egern/audit-report.md
      - uses: actions/upload-artifact@v7
        with:
          name: egern-upstream-audit
          path: egern/audit-report.md
          retention-days: 30
