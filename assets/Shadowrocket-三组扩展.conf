#!name=三组动态策略扩展
#!desc=继承 Johnshall Top500 白名单去广告配置；原配置保持不变

[General]
# 基础配置文件名必须与 Shadowrocket“配置”页里的原文件名一致。
include = sr_top500_whitelist_ad.conf

# 代理转发加密 DNS；不回退系统 DNS。
dns-server = https://dns.google/dns-query#proxy
direct-dns-server = https://dns.google/dns-query#proxy
fallback-dns-server = https://cloudflare-dns.com/dns-query#proxy
dns-direct-system = false
dns-direct-fallback-proxy = true
hijack-dns = :53
ipv6 = false
prefer-ipv6 = false

# 防止 WebRTC/STUN 返回本机公网地址。
stun-response-ip = 1.1.1.1
stun-response-ipv6 = ::1

[Proxy Group]
# “净选/稳净”使用此前在 FlClash 中验证可访问 Gemini 的台湾专线 B 节点。
# 如果 Shadowrocket 里的节点名称不同，请只修改下面两行的 policy-regex-filter。
净选 = url-test,policy-regex-filter=(?i)台湾专线B,interval=600,tolerance=50,timeout=8,url=https://www.gstatic.com/generate_204
稳净 = fallback,policy-regex-filter=(?i)台湾专线B,interval=1200,timeout=8,url=https://www.gstatic.com/generate_204

# 过滤订阅中的流量提示、官网、套餐、到期和客服条目；其余节点每 10 分钟测试一次。
极速 = url-test,policy-regex-filter=^((?!(剩余|流量|官网|套餐|到期|群|邀请|客服|使用说明)).)*$,interval=600,tolerance=100,timeout=8,url=https://speed.cloudflare.com/__down?bytes=131072

[Rule]
# Gemini：先补当前公共规则集中已知容易遗漏的 API，再加载维护中的规则集。
DOMAIN,robinfrontend-pa.googleapis.com,净选
DOMAIN,cloudcode-pa.googleapis.com,净选
DOMAIN,gemini.google.com,净选
DOMAIN-SUFFIX,googleapis.com,净选
DOMAIN-SUFFIX,gstatic.com,净选
DOMAIN-SUFFIX,googleusercontent.com,净选
DOMAIN-SUFFIX,ggpht.com,净选
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Gemini/Gemini.list,净选

# OpenAI / ChatGPT。
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/OpenAI/OpenAI.list,净选
DOMAIN-SUFFIX,openai.com,净选
DOMAIN-SUFFIX,chatgpt.com,净选
DOMAIN-SUFFIX,oaistatic.com,净选
DOMAIN-SUFFIX,oaiusercontent.com,净选

# 访问 Cloudflare 自身服务时使用净选。
DOMAIN-SUFFIX,cloudflare.com,净选

# 原配置的显式去广告、直连和国内规则继续生效；未命中流量改由极速处理。
FINAL,极速
