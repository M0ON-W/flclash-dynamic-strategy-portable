# PUBLIC REDACTED TEMPLATE
ipv6: false
hijack_dns:
- '*'
close_connections_on_policy_change: false
dns:
  bootstrap:
  - 223.5.5.5
  - 119.29.29.29
  upstreams:
    China:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
    Global:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  forward:
  - domain_suffix:
      match: cn
      value: China
  - domain_suffix:
      match: microsoft.cn
      value: China
  - domain_suffix:
      match: officewebapps.cn
      value: China
  - domain_suffix:
      match: partner.microsoftonline.cn
      value: China
  - domain_suffix:
      match: windowsazure.cn
      value: China
  - domain_suffix:
      match: azure.cn
      value: China
  - domain_suffix:
      match: onmschina.cn
      value: China
  - domain_suffix:
      match: 21vbluecloud.com
      value: China
  - domain_suffix:
      match: 21vianet.com.cn
      value: China
  - domain_suffix:
      match: apple.com.cn
      value: China
  - domain_suffix:
      match: icloud.com.cn
      value: China
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/ChinaMaxNoIP/ChinaMaxNoIP.yaml
      value: China
      update_interval: 86400
  - domain_wildcard:
      match: '*'
      value: Global
  proxy_nameservers:
  - https://223.5.5.5/dns-query
  - https://1.1.1.1/dns-query
  skip_tls_verify: false
policy_groups:
- external:
    name: 订阅
    type: fallback
    urls:
    - SUBSCRIPTION_URL
    interval: 600
    timeout: 8
    update_interval: 86400
    hidden: false
- auto_test:
    name: 净选
    policies:
    - 订阅
    flatten: true
    filter: (?i)台湾专线B
    interval: 600
    tolerance: 50
    timeout: 8
    latency_test_url: https://www.gstatic.com/generate_204
    hidden: false
- smart:
    name: 稳净
    policies:
    - 订阅
    flatten: true
    filter: (?i)台湾专线B
    latency_test_url: https://www.gstatic.com/generate_204
    hidden: false
- auto_test:
    name: 极速
    policies:
    - 订阅
    flatten: true
    filter: ^(?!.*(?:流量|官网|套餐|到期|客服|剩余|过期|重置|说明|公告)).+$
    interval: 600
    tolerance: 100
    timeout: 8
    latency_test_url: https://speed.cloudflare.com/__down?bytes=131072
    hidden: false
- select:
    name: PROXY
    policies:
    - 极速
    - 稳净
    - 净选
    - 订阅
    - DIRECT
    hidden: false
